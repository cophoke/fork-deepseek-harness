name: Upstream Sync

on:
  schedule:
    - cron: "0 0 * * *" # 每天 UTC 00:00 运行一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_with_upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.2
        with:
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          upstream_sync_repo: deepseek-ai/deepseek-harness
          upstream_sync_branch: main
          target_sync_branch: main
