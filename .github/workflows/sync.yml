name: Upstream Sync

on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

# 防止手动运行和定时运行同时修改 master
concurrency:
  group: upstream-sync-master
  cancel-in-progress: false

jobs:
  sync_with_upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup SSH deploy key
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SYNC_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 验证私钥
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          ssh-keyscan -H github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync upstream
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # origin 使用 SSH Deploy Key
          git remote set-url origin git@github.com:${{ github.repository }}.git

          # upstream
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/deepseek-ai/deepseek-harness.git
          else
            git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          fi

          # 取得这次要同步的 upstream
          git fetch upstream master

          # 最多重试 3 次，防止同步期间 origin/master 又发生变化
          for attempt in 1 2 3; do
            echo "Sync attempt $attempt..."

            # 关键：每次都重新取得目标仓库最新 master
            git fetch origin master

            # 以远端最新 master 为基准
            git checkout -B master origin/master

            # 再合并 upstream
            git merge upstream/master --no-edit

            # 尝试推送
            if GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
              git push origin master; then
              echo "Sync completed successfully."
              exit 0
            fi

            echo "Remote changed during push, retrying..."

            if [ "$attempt" -eq 3 ]; then
              echo "Sync failed after 3 attempts."
              exit 1
            fi
          done
